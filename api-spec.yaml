components:
  schemas:
    # Сущности системы
    PhysicalPerson:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        birth_date:
          type: string
          format: date
        passport_series_number:
          type: string
        passport_issued_by:
          type: string
        inn:
          type: string
        snils:
          type: string
        account_status:
          type: string
          enum: [активна, неактивна, заблокирована]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time

    PhysicalPersonCreate:
      type: object
      required:
        - first_name
        - last_name
        - email
      properties:
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        birth_date:
          type: string
          format: date
        passport_series_number:
          type: string
        passport_issued_by:
          type: string
        inn:
          type: string
        snils:
          type: string

    PhysicalPersonUpdate:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        birth_date:
          type: string
          format: date
        passport_series_number:
          type: string
        passport_issued_by:
          type: string
        inn:
          type: string
        snils:
          type: string
        account_status:
          type: string
          enum: [активна, неактивна, заблокирована]

    PersonalFolder:
      type: object
      properties:
        id:
          type: string
          format: uuid
        physical_person_id:
          type: string
          format: uuid
        folder_path:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        access_rights:
          type: string
          enum: [чтение, запись, полный доступ]
        status:
          type: string
          enum: [активна, архивирована]

    PersonalFolderCreate:
      type: object
      required:
        - physical_person_id
        - name
        - folder_path
      properties:
        physical_person_id:
          type: string
          format: uuid
        folder_path:
          type: string
        name:
          type: string
        description:
          type: string
        access_rights:
          type: string
          enum: [чтение, запись, полный доступ]

    PersonalFolderUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        access_rights:
          type: string
          enum: [чтение, запись, полный доступ]
        status:
          type: string
          enum: [активна, архивирована]

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        personal_folder_id:
          type: string
          format: uuid
        physical_person_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        file_type:
          type: string
        size:
          type: integer
        file_path:
          type: string
        md5_hash:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [активен, удален]
        metadata:
          type: object

    DocumentCreate:
      type: object
      required:
        - personal_folder_id
        - name
        - file_path
      properties:
        personal_folder_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        file_type:
          type: string
        size:
          type: integer
        file_path:
          type: string
        metadata:
          type: object

    Admin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        login:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [администратор, суперпользователь]
        status:
          type: string
          enum: [активен, неактивен]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time

    AdminCreate:
      type: object
      required:
        - login
        - email
        - first_name
        - last_name
      properties:
        login:
          type: string
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [администратор, суперпользователь]

    AdminUpdate:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [администратор, суперпользователь]
        status:
          type: string
          enum: [активен, неактивен]

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_type:
          type: string
          enum: [physical_person, admin]
        token:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [активна, завершена, истекла]

    SessionCreate:
      type: object
      required:
        - user_id
        - user_type
        - token
        - expires_at
      properties:
        user_id:
          type: string
          format: uuid
        user_type:
          type: string
          enum: [physical_person, admin]
        token:
          type: string
        ip_address:
          type: string
        user_agent:
          type: string
        expires_at:
          type: string
          format: date-time

    Registry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        creator_id:
          type: string
          format: uuid
        filter_parameters:
          type: object
        sort_parameters:
          type: object
        status:
          type: string
          enum: [активен, архивирован]

    RegistryCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        creator_id:
          type: string
          format: uuid
        filter_parameters:
          type: object
        sort_parameters:
          type: object

    RegistryUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        filter_parameters:
          type: object
        sort_parameters:
          type: object
        status:
          type: string
          enum: [активен, архивирован]

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        recipient_type:
          type: string
          enum: [physical_person, admin]
        subject:
          type: string
        content:
          type: string
        notification_type:
          type: string
          enum: [системное, документы, другие]
        created_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [ожидает, отправлено, ошибки]
        user_preferences:
          type: object

    NotificationCreate:
      type: object
      required:
        - recipient_id
        - recipient_type
        - subject
        - content
      properties:
        recipient_id:
          type: string
          format: uuid
        recipient_type:
          type: string
          enum: [physical_person, admin]
        subject:
          type: string
        content:
          type: string
        notification_type:
          type: string
          enum: [системное, документы, другие]
        user_preferences:
          type: object

    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role_name:
          type: string
        description:
          type: string
        privileges:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [активна, неактивна]

    PermissionCreate:
      type: object
      required:
        - role_name
        - privileges
      properties:
        role_name:
          type: string
        description:
          type: string
        privileges:
          type: array
          items:
            type: string

    PermissionUpdate:
      type: object
      properties:
        description:
          type: string
        privileges:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [активна, неактивна]

    OperationLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_type:
          type: string
          enum: [physical_person, admin]
        operation_type:
          type: string
          enum: [вход, выход, создание, изменение, удаление]
        operation_description:
          type: string
        operation_at:
          type: string
          format: date-time
        ip_address:
          type: string
        data_before:
          type: object
        data_after:
          type: object
        success:
          type: boolean

    SearchQuery:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        user_type:
          type: string
          enum: [physical_person, admin]
        query:
          type: string
        search_at:
          type: string
          format: date-time
        results:
          type: array
          items:
            type: object
        result_count:
          type: integer
        filter_parameters:
          type: object
        sort_parameters:
          type: object
        status:
          type: string
          enum: [ожидает, выполнен, ошибка]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

  responses:
    Unauthorized:
      description: Неавторизованный доступ
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Unauthorized"
              message:
                type: string
                example: "Необходима авторизация"

    Forbidden:
      description: Доступ запрещён
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Forbidden"
              message:
                type: string
                example: "У вас нет прав доступа к этому ресурсу"

    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Bad Request"
              message:
                type: string
                example: "Некорректные данные запроса"

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Not Found"
              message:
                type: string
                example: "Ресурс не найден"

