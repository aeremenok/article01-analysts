openapi: 3.0.3
info:
  title: CRM система НКО
  version: 1.0.0
  description: API для системы управления клиентами НКО с возможностью работы с документами, реестрами и пользователями

servers:
  - url: https://api.nko.ru/v1
    description: Production сервер

paths:
  # Физические лица
  /physical-persons:
    get:
      summary: Получить список физических лиц
      description: Получить список всех физических лиц с возможностью фильтрации и сортировки
      tags:
        - Физические лица
      parameters:
        - name: page
          in: query
          description: Номер страницы
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: Количество элементов на странице
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: search
          in: query
          description: Поисковый запрос по имени, фамилии, email
          required: false
          schema:
            type: string
        - name: status
          in: query
          description: Фильтр по статусу учетной записи
          required: false
          schema:
            type: string
            enum: [активна, неактивна, заблокирована]
        - name: first_name
          in: query
          description: Фильтр по имени
          required: false
          schema:
            type: string
        - name: last_name
          in: query
          description: Фильтр по фамилии
          required: false
          schema:
            type: string
        - name: email
          in: query
          description: Фильтр по email
          required: false
          schema:
            type: string
        - name: birth_date_from
          in: query
          description: Фильтр по дате рождения (с)
          required: false
          schema:
            type: string
            format: date
        - name: birth_date_to
          in: query
          description: Фильтр по дате рождения (по)
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PhysicalPerson'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Создать нового физического лица
      description: Регистрация нового физического лица в системе
      tags:
        - Физические лица
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalPersonCreate'
      responses:
        '201':
          description: Физическое лицо создано успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /physical-persons/{id}:
    get:
      summary: Получить информацию о физическом лице
      description: Получить детальную информацию о конкретном физическом лице
      tags:
        - Физические лица
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalPerson'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: Получить информацию личного кабинета
      description: Получить информацию для личного кабинета (информация о пользователе и его документы)
      tags:
        - Физические лица
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ с информацией личного кабинета
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalPersonDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Обновить информацию о физическом лице
      description: Обновление информации о физическом лице
      tags:
        - Физические лица
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalPersonUpdate'
      responses:
        '200':
          description: Информация о физическом лице обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Назначить роль физическому лицу
      description: Назначение роли пользователю с типом physical_person
      tags:
        - Физические лица
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalPersonRoleUpdate'
      responses:
        '200':
          description: Роль физического лица обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalPerson'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Персональные папки
  /personal-folders:
    get:
      summary: Получить список персональных папок
      description: Получить список всех персональных папок
      tags:
        - Персональные папки
      parameters:
        - name: physical_person_id
          in: query
          description: ID физического лица
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Фильтр по статусу
          required: false
          schema:
            type: string
            enum: [активна, архивирована]
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalFolder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Создать персональную папку
      description: Создание новой персональной папки для физического лица
      tags:
        - Персональные папки
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalFolderCreate'
      responses:
        '201':
          description: Персональная папка создана успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalFolder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Создать папку для физического лица
      description: Создание персональной папки при регистрации нового ФЛ
      tags:
        - Персональные папки
      parameters:
        - name: physical_person_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Персональная папка создана успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalFolder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /personal-folders/{id}:
    get:
      summary: Получить информацию о персональной папке
      description: Получить детальную информацию о персональной папке
      tags:
        - Персональные папки
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalFolder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Обновить информацию о персональной папке
      description: Обновление информации о персональной папке
      tags:
        - Персональные папки
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalFolderUpdate'
      responses:
        '200':
          description: Информация о папке обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalFolder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Документы
  /documents:
    get:
      summary: Получить список документов
      description: Получить список всех документов с возможностью фильтрации
      tags:
        - Документы
      parameters:
        - name: personal_folder_id
          in: query
          description: ID персональной папки
          required: false
          schema:
            type: string
            format: uuid
        - name: physical_person_id
          in: query
          description: ID физического лица
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Фильтр по статусу
          required: false
          schema:
            type: string
            enum: [активен, удален]
        - name: search
          in: query
          description: Поисковый запрос по названию или описанию
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Загрузить документ
      description: Загрузка нового документа в персональную папку
      tags:
        - Документы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCreate'
      responses:
        '201':
          description: Документ загружен успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Загрузить документы пакетно
      description: Массовая загрузка документов
      tags:
        - Документы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentBulkCreate'
      responses:
        '201':
          description: Документы загружены успешно
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /documents/{id}:
    get:
      summary: Получить информацию о документе
      description: Получить детальную информацию о документе
      tags:
        - Документы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: Скачать документ
      description: Скачать документ по ID
      tags:
        - Документы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ с файлом
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Удалить документ
      description: Удаление документа (пометка как удаленный)
      tags:
        - Документы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Документ удален успешно
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Администраторы
  /admins:
    get:
      summary: Получить список администраторов
      description: Получить список всех администраторов
      tags:
        - Администраторы
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Admin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Создать нового администратора
      description: Регистрация нового администратора
      tags:
        - Администраторы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreate'
      responses:
        '201':
          description: Администратор создан успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admins/{id}:
    get:
      summary: Получить информацию об администраторе
      description: Получить детальную информацию об администраторе
      tags:
        - Администраторы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Обновить информацию об администраторе
      description: Обновление информации об администраторе
      tags:
        - Администраторы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdate'
      responses:
        '200':
          description: Информация об администраторе обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Назначить роль администратору
      description: Назначение роли пользователю с типом admin
      tags:
        - Администраторы
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminRoleUpdate'
      responses:
        '200':
          description: Роль администратора обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Admin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Сессии
  /sessions:
    get:
      summary: Получить список сессий
      description: Получить список всех сессий пользователей
      tags:
        - Сессии
      parameters:
        - name: user_id
          in: query
          description: ID пользователя (физического лица или администратора)
          required: false
          schema:
            type: string
            format: uuid
        - name: user_type
          in: query
          description: Тип пользователя
          required: false
          schema:
            type: string
            enum: [physical_person, admin]
        - name: status
          in: query
          description: Фильтр по статусу
          required: false
          schema:
            type: string
            enum: [активна, завершена, истекла]
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Создать новую сессию (вход)
      description: Создание новой сессии пользователя при входе в систему
      tags:
        - Сессии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
      responses:
        '201':
          description: Сессия создана успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /sessions/{id}:
    get:
      summary: Получить информацию о сессии
      description: Получить детальную информацию о сессии
      tags:
        - Сессии
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Завершить сессию
      description: Завершение текущей сессии пользователя
      tags:
        - Сессии
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Сессия завершена успешно
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Реестры
  /registries:
    get:
      summary: Получить список реестров
      description: Получить список всех реестров физических лиц
      tags:
        - Реестры
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу
          required: false
          schema:
            type: string
            enum: [активен, архивирован]
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Registry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      summary: Создать новый реестр
      description: Создание нового реестра физических лиц
      tags:
        - Реестры
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistryCreate'
      responses:
        '201':
          description: Реестр создан успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /registries/{id}:
    get:
      summary: Получить информацию о реестре
      description: Получить детальную информацию о реестре
      tags:
        - Реестры
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Registry'
        '401':
