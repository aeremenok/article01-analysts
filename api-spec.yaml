        - name: recipient_type
          in: query
          description: Тип получателя
          required: false
          schema:
            type: string
            enum: [physical_person, admin]
        - name: status
          in: query
          description: Фильтр по статусу
          required: false
          schema:
            type: string
            enum: [ожидает, отправлено, ошибки]
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
