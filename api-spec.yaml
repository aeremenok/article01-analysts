        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/{id}:
    get:
      summary: Получить информацию об уведомлении
      description: Получить детальную информацию об уведомлении
      tags:
        - Уведомления
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Права доступа
  /permissions:
    get:
      summary: Получить список прав доступа
      description: Получить список всех доступных прав
      tags:
        - Права доступа
      responses:
        '200':
          description: Успешный ответ
