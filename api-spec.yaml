            schema:
              $ref: '#/components/schemas/PermissionCreate'
      responses:
        '201':
          description: Права доступа созданы успешно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /permissions/{id}:
    get:
      summary: Получить информацию о правах доступа
      description: Получить детальную информацию о правах доступа
      tags:
        - Права доступа
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
