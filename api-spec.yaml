    put:
      summary: Обновить информацию о правах доступа
      description: Обновление информации о правах доступа
      tags:
        - Права доступа
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionUpdate'
      responses:
        '200':
          description: Информация о правах обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Логи операций
  /operation-logs:
    get:
      summary: Получить список логов операций
      description: Получить список всех операций пользователей
      tags:
        - Логи операций
      parameters:
        - name: user_id
          in: query
          description: ID пользователя (физического лица или администратора)
          required: false
